name: Public source iOS candidate
on:
  workflow_dispatch:
    inputs:
      typography_only:
        description: 'Targeted message parser and UI gate before release regression'
        type: boolean
        default: false
      files_only:
        description: 'Targeted conversation files UI gate'
        type: boolean
        default: false
      core_only:
        description: 'Swift-only provenance regression gate'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated backend regressions with public native cron source
        if: ${{ !inputs.typography_only && !inputs.files_only && !inputs.core_only }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          source "$RUNNER_TEMP/ci-venv/bin/activate"
          python -m pip install aiohttp==3.14.5 PyYAML==6.0.3 croniter==6.2.4 python-dotenv==1.2.4 ruamel.yaml==0.19.1
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/native-hermes"
          git -C "$RUNNER_TEMP/native-hermes" checkout 63220ae5c3b65013f9e240bac6d489021bc505e0
          export QIU_HERMES_SOURCE="$RUNNER_TEMP/native-hermes"
          mkdir -p evidence
          python scripts/verify_native_approval.py 2>&1 | tee evidence/native-approval.log
          for test in workspace proxy attachments stop_safety run_history sessions profile_sessions session_sync cron artifacts artifact_http; do
            python "scripts/test_${test}.py" 2>&1 | tee "evidence/backend-${test}.log"
          done
      - name: Swift regression with loopback SSE fixture only
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 scripts/sse_fixture.py > evidence/sse-fixture.log 2>&1 &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" || true' EXIT
          export NO_PROXY=127.0.0.1,localhost
          export no_proxy=127.0.0.1,localhost
          curl --noproxy '*' --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 3 http://127.0.0.1:18765/ready > /dev/null
          if [ "${{ inputs.core_only }}" = true ]; then
            swift test --filter 'ConversationFilesTests|QuotationTests|VoiceInputTests' 2>&1 | tee evidence/swift-test.log
          elif [ "${{ inputs.typography_only }}" = true ]; then
            swift test --filter 'MessageTypographyTests|ReplyPresentationTests' 2>&1 | tee evidence/swift-test.log
          else
            swift test --skip LiveRunTests --skip WorkspaceLiveTests 2>&1 | tee evidence/swift-test.log
          fi
      - name: Generate Xcode project
        if: ${{ !inputs.core_only }}
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build real unsigned iPhoneOS arm64 candidate
        if: ${{ !inputs.core_only }}
        run: |
          set -euo pipefail
          xcodebuild -project QiuQiu.xcodeproj -scheme QiuQiu -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee evidence/device-build.log
      - name: Simulator smoke and injected voice state acceptance
        if: ${{ !inputs.core_only }}
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          "$pythonLocation/bin/python3" -u scripts/reply_ui_fixture.py > evidence/reply-fixture.log 2>&1 &
          REPLY_PID=$!
          trap 'kill "$REPLY_PID" || true' EXIT
          curl --noproxy '*' --fail --silent --show-error --retry 60 --retry-all-errors --retry-delay 2 --connect-timeout 2 --max-time 3 http://127.0.0.1:18766/ready > /dev/null
          EXTRA=""
          if [ "${{ inputs.typography_only }}" = true ]; then
            EXTRA="-only-testing:QiuQiuUITests/CompanionUITests/testTypographyHeadingsListsLightAndDarkHugeText -only-testing:QiuQiuUITests/CompanionUITests/testTypographyCodeWrapExpandCopyAndTableContainment -only-testing:QiuQiuUITests/CompanionUITests/testTypographyStreamingReaderStaysPutAndCanFollow"
          fi
          if [ "${{ inputs.typography_only }}" != true ]; then
            EXTRA="-only-testing:QiuQiuUITests/CompanionUITests/testQuoteManualSendReachesFixtureAndVoiceDenialBackground -only-testing:QiuQiuUITests/CompanionUITests/testLeftSwipeQuotesSpecificMessageAboveComposer -only-testing:QiuQiuUITests/CompanionUITests/testInlineVoiceShowsComposerWithoutSheet -only-testing:QiuQiuUITests/CompanionUITests/testConversationFilesListPreviewShareAndStableJumpDuringBusy -only-testing:QiuQiuUITests/CompanionUITests/testConversationFilesEmptyUnavailableErrorsAndHugeNames -only-testing:QiuQiuPhotoTests -only-testing:QiuQiuUITests/CompanionUITests/testReplyRangeSelectionCopiesOnlyTargetToComposer -only-testing:QiuQiuUITests/CompanionUITests/testReplyImageFilePreviewShareAndAnswerDraft -only-testing:QiuQiuUITests/CompanionUITests/testReplyFormattingLargeTextAndApprovalConfirmation -only-testing:QiuQiuUITests/CompanionUITests/testOngoingServerSessionShowsHonestSyncStateWithoutSending -only-testing:QiuQiuUITests/CompanionUITests/testAllSourcePaginationLoadsOlderReadOnlyConversation -only-testing:QiuQiuUITests/CompanionUITests/testServerRowOneTapOpensStoredHistoryWithoutImportOrSend -only-testing:QiuQiuUITests/CompanionUITests/testVoiceEntryCancelDoesNotSendOrReplaceDraft -only-testing:QiuQiuUITests/CompanionUITests/testNavigationManagementAndKeyboard -only-testing:QiuQiuUITests/CompanionUITests/testBusyAllowsHistoryTasksSettingsAndExportInDarkLargeText -only-testing:QiuQiuUITests/CompanionUITests/testTypographyHeadingsListsLightAndDarkHugeText -only-testing:QiuQiuUITests/CompanionUITests/testTypographyCodeWrapExpandCopyAndTableContainment -only-testing:QiuQiuUITests/CompanionUITests/testTypographyStreamingReaderStaysPutAndCanFollow"
          fi
          if [ "${{ inputs.files_only }}" = true ]; then
            EXTRA="-only-testing:QiuQiuUITests/CompanionUITests/testQuoteManualSendReachesFixtureAndVoiceDenialBackground -only-testing:QiuQiuUITests/CompanionUITests/testLeftSwipeQuotesSpecificMessageAboveComposer -only-testing:QiuQiuUITests/CompanionUITests/testInlineVoiceShowsComposerWithoutSheet -only-testing:QiuQiuUITests/CompanionUITests/testConversationFilesListPreviewShareAndStableJumpDuringBusy -only-testing:QiuQiuUITests/CompanionUITests/testConversationFilesEmptyUnavailableErrorsAndHugeNames"
          fi
          xcodebuild -project QiuQiu.xcodeproj -scheme QiuQiu -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath simulator-build -resultBundlePath evidence/ui-results.xcresult CODE_SIGNING_ALLOWED=NO $EXTRA test 2>&1 | tee evidence/ui-test.log
      - name: Package and verify IPA
        if: ${{ !inputs.core_only }}
        run: |
          set -euo pipefail
          mkdir -p build/package/Payload
          cp -R build/Build/Products/Release-iphoneos/QiuQiu.app build/package/Payload/
          APP=build/package/Payload/QiuQiu.app
          file "$APP/QiuQiu" | tee evidence/binary-info.txt
          xcrun lipo "$APP/QiuQiu" -verify_arch arm64
          xcrun vtool -show-build "$APP/QiuQiu" | tee -a evidence/binary-info.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | tee evidence/bundle-id.txt
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = 18
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = org.hermesclient.qiuqiu
          if codesign -d "$APP" 2>/dev/null; then exit 1; fi
          (cd build/package && /usr/bin/zip -qry ../QiuQiu-Build18-unsigned.ipa Payload)
          shasum -a 256 build/QiuQiu-Build18-unsigned.ipa | tee evidence/SHA256SUMS
      - name: Export screenshots and metadata on every outcome
        if: always()
        run: |
          mkdir -p evidence
          { git rev-parse HEAD; sw_vers; xcodebuild -version; } > evidence/source-platform.txt
          if test -d evidence/ui-results.xcresult; then
            xcrun xcresulttool export attachments --path evidence/ui-results.xcresult --output-path evidence/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.core_only }}
        with:
          name: QiuQiu-Build18-unsigned-ipa
          path: |
            build/QiuQiu-Build18-unsigned.ipa
            evidence/SHA256SUMS
            evidence/binary-info.txt
          if-no-files-found: error
          retention-days: 14
