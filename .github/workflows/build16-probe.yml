name: Build16 narrow reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare simulator project
        run: |
          mkdir -p evidence
          brew install xcodegen
          xcodegen generate
      - name: Reproduce reply word selection and Apple driver notifications
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(x["udid"] for k,v in json.load(sys.stdin)["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild -project QiuQiu.xcodeproj -scheme QiuQiu -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath probe-build -resultBundlePath evidence/probe.xcresult CODE_SIGNING_ALLOWED=NO -only-testing:QiuQiuUITests/CompanionUITests/testReplyRangeSelectionCopiesOnlyTargetToComposer -only-testing:QiuQiuPhotoTests/AppleVoiceNotificationTests test 2>&1 | tee evidence/probe.log
      - name: Export reproduction evidence
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          if test -d evidence/probe.xcresult; then
            xcrun xcresulttool export attachments --path evidence/probe.xcresult --output-path evidence/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build16-probe-evidence
          path: evidence
          retention-days: 14
