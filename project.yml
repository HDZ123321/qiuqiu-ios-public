name: QiuQiu
options:
  bundleIdPrefix: org.hermesclient
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '22'
    QIU_SHARE_APP_GROUP: group.org.hermesclient.qiuqiu
targets:
  QiuQiu:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - Sources/Core
      - path: Resources/Artwork
        buildPhase: resources
      - path: Resources/SourceAttribution.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hermesclient.qiuqiu
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/QiuQiu.entitlements
    dependencies:
      - target: QiuQiuShare
        embed: true
  QiuQiuShare:
    type: app-extension
    platform: iOS
    sources:
      - Sources/ShareExtension
      - Sources/Core
      - Sources/App/ShareContainer.swift
      - Sources/App/ShareProviderIntake.swift
      - Sources/App/PhotoNormalizer.swift
      - Sources/App/LocalDocumentReader.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hermesclient.qiuqiu.share
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/ShareInfo.plist
        CODE_SIGN_ENTITLEMENTS: Resources/QiuQiuShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  QiuQiuPhotoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TestsIOS]
    dependencies:
      - target: QiuQiu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/QiuQiu.app/QiuQiu"
        BUNDLE_LOADER: "$(TEST_HOST)"
  QiuQiuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: QiuQiu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  QiuQiu:
    build:
      targets:
        QiuQiu: all
    test:
      targets: [QiuQiuPhotoTests, QiuQiuUITests]
